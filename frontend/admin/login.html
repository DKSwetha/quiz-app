<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login - Quiz Application</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../shared/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card p-4">
      <h3 class="login-title text-center mb-1">Quiz Application</h3>
      <p class="text-center text-muted mb-4">Admin sign in</p>

      <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-brand w-100" id="loginBtn">Log in</button>
      </form>
    </div>
  </div>

  <script src="../shared/api.js"></script>
  <script>
    // Already logged in as admin? Go straight to the dashboard.
    const existing = getUser();
    if (existing && existing.role === "admin") {
      window.location.href = "dashboard.html";
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const user = await loginRequest(email, password);

        if (user.role !== "admin") {
          throw new Error("This page is for admins only. Please use the member login.");
        }
        saveUser(user);
        window.location.href = "dashboard.html";
      } catch (err) {
        showAlert("alertBox", err.message);
        btn.disabled = false;
        btn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
