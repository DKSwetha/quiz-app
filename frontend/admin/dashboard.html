<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard - Quiz Application</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../shared/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark navbar-brand-custom px-3">
    <span class="navbar-brand mb-0 h1">Quiz Application - Admin</span>
    <div class="d-flex align-items-center text-white">
      <span class="me-3" id="userName"></span>
      <button class="btn btn-outline-light btn-sm" onclick="logout('login.html')">Log out</button>
    </div>
  </nav>

  <div class="container py-4">
    <h4 class="mb-4">Dashboard</h4>
    <div class="row g-3">
      <div class="col-md-4"><a href="members.html" class="text-decoration-none text-dark"><div class="card menu-card p-3"><h6>Members</h6><p class="text-muted mb-0">Add, edit, upload CSV</p></div></a></div>
      <div class="col-md-4"><a href="questions.html" class="text-decoration-none text-dark"><div class="card menu-card p-3"><h6>Question bank</h6><p class="text-muted mb-0">Add, edit, import CSV</p></div></a></div>
      <div class="col-md-4"><div class="card menu-card p-3"><h6>Tests</h6><p class="text-muted mb-0">Coming soon</p></div></div>
      <div class="col-md-4"><div class="card menu-card p-3"><h6>Monitor</h6><p class="text-muted mb-0">Coming soon</p></div></div>
      <div class="col-md-4"><div class="card menu-card p-3"><h6>Results</h6><p class="text-muted mb-0">Coming soon</p></div></div>
      <div class="col-md-4"><div class="card menu-card p-3"><h6>Answer key</h6><p class="text-muted mb-0">Coming soon</p></div></div>
    </div>
  </div>

  <script src="../shared/api.js"></script>
  <script>
    const user = requireRole("admin", "login.html");
    if (user) {
      document.getElementById("userName").textContent = user.name;
    }
  </script>
</body>
</html>
