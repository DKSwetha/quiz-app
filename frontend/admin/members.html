<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members - Quiz Application</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../shared/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark navbar-brand-custom px-3">
    <a class="navbar-brand mb-0 h1" href="dashboard.html">Quiz Application - Admin</a>
    <div class="d-flex align-items-center text-white">
      <span class="me-3" id="userName"></span>
      <button class="btn btn-outline-light btn-sm" onclick="logout('login.html')">Log out</button>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <h4 class="mb-0">Members</h4>
      <div>
        <button class="btn btn-outline-secondary me-2" id="openUploadBtn">Upload CSV</button>
        <button class="btn btn-brand" id="openAddBtn">+ Add member</button>
      </div>
    </div>

    <div id="pageAlert" class="alert d-none"></div>

    <div class="card menu-card p-3 mb-3">
      <div class="row g-2">
        <div class="col-md-5"><input type="text" id="searchInput" class="form-control" placeholder="Search by name or email"></div>
        <div class="col-md-4"><select id="batchFilter" class="form-select"><option value="">All batches</option></select></div>
        <div class="col-md-3">
          <select id="statusFilter" class="form-select">
            <option value="">All statuses</option>
            <option value="active">Active</option>
            <option value="inactive">Deactivated</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card menu-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr><th>Name</th><th>Email</th><th>Batch</th><th>Status</th><th>Password</th><th class="text-end">Actions</th></tr>
          </thead>
          <tbody id="membersBody"></tbody>
        </table>
      </div>
    </div>
    <p class="text-muted small mt-2" id="countText"></p>
  </div>

  <!-- Add / Edit modal -->
  <div class="modal fade" id="memberModal" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="memberForm">
        <div class="modal-header">
          <h5 class="modal-title" id="memberModalTitle">Add member</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="modalAlert" class="alert alert-danger d-none"></div>
          <input type="hidden" id="memberId">
          <div class="mb-3"><label class="form-label" for="mName">Name</label><input class="form-control" id="mName" required minlength="2" maxlength="100"></div>
          <div class="mb-3"><label class="form-label" for="mEmail">Email</label><input type="email" class="form-control" id="mEmail" required></div>
          <div class="mb-3">
            <label class="form-label" for="mBatch">Batch / team</label>
            <input class="form-control" id="mBatch" list="batchList" maxlength="100" placeholder="e.g. Batch A">
            <datalist id="batchList"></datalist>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand" id="memberSaveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CSV upload modal -->
  <div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="uploadForm">
        <div class="modal-header">
          <h5 class="modal-title">Upload members from CSV</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small">
            The file needs the columns <strong>name</strong>, <strong>email</strong> and optionally <strong>batch</strong>.
            <a href="#" id="sampleLink">Download a sample</a>.
          </p>
          <div id="uploadAlert" class="alert d-none"></div>
          <input type="file" class="form-control" id="csvFile" accept=".csv" required>
          <div id="uploadResult" class="mt-3 small"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-brand" id="uploadBtn">Upload</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/api.js"></script>
  <script src="members.js"></script>
</body>
</html>
