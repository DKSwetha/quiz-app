
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Member Login - Quiz Application</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <div class="outer">


        <section class="left">
            <div class="left-content">
                <h1>Quiz Application</h1>

                <p>
                    Learn, practice, and test your knowledge.
                    Sign in to continue your learning journey.
                </p>

                <img
                    src="https://static.vecteezy.com/system/resources/thumbnails/003/689/228/small_2x/online-registration-or-sign-up-login-for-account-on-smartphone-app-user-interface-with-secure-password-mobile-application-for-ui-web-banner-access-cartoon-people-illustration-vector.jpg"
                    alt="Online login illustration"
                >
            </div>
        </section>



        <section class="right">

            <div class="login-container">

                <h3>QUIZ APPLICATION</h3>

                <h2>Member Login</h2>

                <p class="welcome-text">
                    Welcome back! Please enter your details.
                </p>


                <div
                    id="alertBox"
                    class="alert d-none"
                    role="alert"
                ></div>



                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>


                    <button type="submit" id="loginBtn">
                        Login
                    </button>

                </form>


                <footer>
                    <p>Don't have an account?</p>
                    <a href="./signup.html">Sign up</a>
                </footer>

            </div>

        </section>

    </div>



    <script src="../../shared/api.js"></script>
    <script src="../js/login.js"></script>

</body>
</html>
