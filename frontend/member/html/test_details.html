
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Test Details - Quiz Application</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link href="../../shared/style.css" rel="stylesheet">
    <link href="../css/dashboard.css" rel="stylesheet">
    <link href="../css/test_details.css" rel="stylesheet">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg dashboard-navbar">
        <div class="container">

            <a class="navbar-brand" href="dashboard.html">
                <span class="brand-icon">Q</span>
                Quiz Application
            </a>

            <div class="d-flex align-items-center gap-3">

                <div class="member-info">
                    <span class="member-avatar">M</span>
                    <span id="userName">Member</span>
                </div>

                <button
                    class="btn logout-btn"
                    id="logoutBtn"
                    type="button">
                    Log out
                </button>

            </div>
        </div>
    </nav>


    <main class="container details-container">

        <!-- Page heading -->
        <section class="details-welcome">

            <div>
                <span class="welcome-label">MEMBER PORTAL</span>

                <h1>Test Details</h1>

                <p>
                    Review the test information and instructions
                    before starting your examination.
                </p>
            </div>

            <div class="details-decoration">
                <div class="details-icon">Q</div>
            </div>

        </section>


        <!-- Test information -->
        <section class="details-section">

            <div class="section-heading">
                <h2>Test Information</h2>
                <p>Review the following details carefully.</p>
            </div>

            <div id="testDetails" class="test-information">

                <div class="loading-message">
                    Loading test details...
                </div>

            </div>

            <div
                id="testAlert"
                class="alert d-none mt-4"
                role="alert"
                aria-live="assertive">
            </div>

            <div class="details-actions">

                <a
                    href="dashboard.html"
                    class="btn back-btn">
                    Back to Dashboard
                </a>

                <button
                    id="startTestBtn"
                    class="btn start-test-btn"
                    type="button"
                    disabled>
                    Loading...
                </button>

            </div>

        </section>


        <!-- Footer -->
        <footer class="dashboard-footer">
            <p>Quiz Application &copy; 2026. All rights reserved.</p>
        </footer>

    </main>


    <!-- JavaScript -->
    <script src="../../shared/api.js"></script>
    <script src="../js/test_details.js"></script>

</body>
</html>
