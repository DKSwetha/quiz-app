
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Member Dashboard - Quiz Application</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link href="../shared/style.css" rel="stylesheet">
</head>

<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-dark navbar-brand-custom px-3">

        <span class="navbar-brand mb-0 h1">
            Quiz Application - Member
        </span>

        <div class="d-flex align-items-center text-white">

            <span class="me-3" id="userName"></span>

            <button
                class="btn btn-outline-light btn-sm"
                onclick="logout('login.html')">

                Log out

            </button>

        </div>

    </nav>


    <!-- Dashboard content -->
    <div class="container py-4">

        <h4 class="mb-4">Member Dashboard</h4>

        <div class="card menu-card p-4">

            <h5>Welcome!</h5>

            <p class="text-muted mb-0">
                You have successfully logged in to your member account.
            </p>

        </div>

    </div>


    <!-- Authentication and role verification -->
    <script src="../shared/api.js"></script>

    <script>

        const user = requireRole("member", "login.html");

        if (user) {

            document.getElementById("userName").textContent = user.name;

        }

    </script>

</body>
</html>
